<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta property="og:title" content="Shruti weds Mohit – Wedding Invitation">
<meta property="og:description" content="Monday, 30 November 2026 · Royal Residency, Aligarh. Tap to open your invitation.">
<meta property="og:image" content="https://YOUR-USERNAME.github.io/REPO-NAME/images/cover.jpg">
<meta property="og:type" content="website">
<title>Shruti weds Mohit – Wedding Invitation</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;1,500&display=swap" rel="stylesheet">
<style>
:root{--bg1:#f8f2e4;--bg2:#e8dcc0;--gold:#b8924a;--ink:#3b2a20;--deep:#7d5f26;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:inherit;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{background:radial-gradient(ellipse at 50% 30%,var(--bg1) 0%,var(--bg2) 80%);color:var(--ink);font-family:"Cormorant Garamond",Georgia,serif;overflow:hidden}

/* ---------- Envelope ---------- */
#stage{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;transition:opacity .8s}
#stage.gone{opacity:0;pointer-events:none}
.names{font-size:clamp(26px,8vw,40px);font-style:italic;margin:0 0 6px;color:var(--deep)}
.sub{margin:0 0 34px;letter-spacing:.08em;font-size:17px;opacity:.85}
.env{position:relative;width:min(86vw,420px);aspect-ratio:4/3;cursor:pointer;perspective:1000px;border:0;background:none;padding:0}
.back{position:absolute;inset:0;background:#e0cfa6;border-radius:6px;box-shadow:0 24px 50px rgba(90,60,20,.3)}
.card{position:absolute;left:5%;right:5%;top:6%;bottom:6%;background:#fff;border-radius:4px;transition:transform 1s .6s cubic-bezier(.3,.7,.2,1);z-index:2}
.card img{width:100%;height:100%;object-fit:cover;display:block;border-radius:4px}
.front{position:absolute;inset:0;z-index:3;background:linear-gradient(160deg,#f5ecd6,#e8d9b6);clip-path:polygon(0 0,50% 52%,100% 0,100% 100%,0 100%);border-radius:6px}
.flap{position:absolute;left:0;right:0;top:0;height:56%;z-index:4;background:linear-gradient(#f7efdb,#e6d6af);clip-path:polygon(0 0,100% 0,50% 100%);transform-origin:top;transition:transform .8s,z-index 0s .4s;border-radius:6px 6px 0 0}
.seal{position:absolute;left:50%;top:44%;width:17%;aspect-ratio:1;transform:translate(-50%,-50%);z-index:5;border-radius:50%;background:radial-gradient(circle at 35% 30%,#e6c987,#c9a45c 60%,#8f7236);display:grid;place-items:center;color:var(--ink);font-style:italic;font-weight:500;font-size:clamp(13px,4.2vw,20px);box-shadow:0 3px 8px rgba(0,0,0,.4);transition:opacity .3s}
.tap{margin-top:34px;font-size:18px;letter-spacing:.12em;animation:p 2s infinite}
@keyframes p{50%{opacity:.35}}
.open .flap{transform:rotateX(180deg);z-index:1}
.open .seal{opacity:0}
.open .card{transform:translateY(-62%) scale(1.05)}
.tap.hide{visibility:hidden}

/* ---------- Book ---------- */
#view{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;opacity:0;pointer-events:none;transition:opacity .9s;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
#view.show{opacity:1;pointer-events:auto}
.head{text-align:center;padding:16px 12px 4px;font-style:italic;color:var(--deep);font-size:24px}
.shelf{flex:1;width:100%;display:flex;align-items:center;justify-content:center;perspective:1800px;padding:0 10px}
.book{position:relative;width:min(94vw,640px,calc((100vh - 200px) * 1.2));aspect-ratio:1000/833;touch-action:pan-y;cursor:pointer}
.leaf{position:absolute;inset:0;transform-origin:left center;transform-style:preserve-3d;-webkit-transform-style:preserve-3d;transition:transform 1.1s cubic-bezier(.45,.05,.25,1),opacity 0s}
.leaf.flip{transform:rotateY(-180deg);opacity:0;transition:transform 1.1s cubic-bezier(.45,.05,.25,1),opacity 0s 1.05s}
.f{position:absolute;inset:0;border-radius:6px;overflow:hidden;background:#f6efe0;backface-visibility:hidden;-webkit-backface-visibility:hidden;box-shadow:0 14px 32px rgba(90,60,20,.28)}
.f img{width:100%;height:100%;object-fit:contain;display:block}
.f::after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(90deg,rgba(90,60,20,.25),transparent 7%)}
.f.rev{transform:rotateY(180deg);background:linear-gradient(270deg,#e8dcc0,#f6efe0)}
.f.rev::after{background:linear-gradient(270deg,rgba(90,60,20,.25),transparent 12%)}
.foot{display:flex;flex-direction:column;align-items:center;gap:10px;padding:8px 0 16px}
.nav{display:flex;align-items:center;gap:18px}
.nav button{width:44px;height:44px;border-radius:50%;border:1px solid var(--gold);background:transparent;color:var(--deep);font-size:24px;line-height:1;cursor:pointer}
.nav button:disabled{opacity:.3;cursor:default}
.count{font-size:20px;min-width:64px;text-align:center}
.hint{font-size:15px;opacity:.7;margin:0}
.map{color:#fffaf0;background:#9a7632;text-decoration:none;padding:9px 20px;border-radius:30px;font-size:18px;font-weight:500}
@media (prefers-reduced-motion:reduce){*{transition-duration:.01s!important;animation:none!important}}
</style></head>
<body>
<div id="stage">
  <p class="names">Shruti &amp; Mohit</p>
  <p class="sub">You’re invited</p>
  <button class="env" id="env" aria-label="Open the invitation">
    <div class="back"></div>
    <div class="card"><img src="images/cover.jpg" alt=""></div>
    <div class="front"></div>
    <div class="flap"></div>
    <div class="seal">S&amp;M</div>
  </button>
  <div class="tap" id="tap">Tap to open</div>
</div>

<div id="view">
  <div class="head">Shruti weds Mohit</div>
  <div class="shelf">
    <div class="book" id="book">
      <div class="leaf"><div class="f"><img src="images/cover.jpg" alt="Save the date: Monday, 30 November 2026"></div><div class="f rev"></div></div>
      <div class="leaf"><div class="f"><img src="images/invitation.jpg" alt="Wedding ceremony invitation"></div><div class="f rev"></div></div>
      <div class="leaf"><div class="f"><img src="images/schedule.jpg" alt="Golden Moments: event schedule"></div><div class="f rev"></div></div>
      <div class="leaf"><div class="f"><img src="images/compliments.jpg" alt="With best compliments from"></div><div class="f rev"></div></div>
    </div>
  </div>
  <div class="foot">
    <div class="nav">
      <button id="prev" aria-label="Previous page">&#8249;</button>
      <div class="count" id="count">1 / 4</div>
      <button id="next" aria-label="Next page">&#8250;</button>
    </div>
    <p class="hint" id="hint">Tap or swipe to turn the page</p>
    <a class="map" href="https://www.google.com/maps/search/?api=1&query=Royal+Residency+GT+Road+Aligarh" target="_blank" rel="noopener">Venue on map</a>
  </div>
</div>

<script>
var env=document.getElementById('env'),stage=document.getElementById('stage'),view=document.getElementById('view'),
    book=document.getElementById('book'),leaves=[].slice.call(document.querySelectorAll('.leaf')),
    prev=document.getElementById('prev'),next=document.getElementById('next'),count=document.getElementById('count'),
    hint=document.getElementById('hint'),N=leaves.length,cur=0,opened=false,swiped=false,sx=0;

leaves.forEach(function(l,i){l.style.zIndex=N-i});

function render(){
  leaves.forEach(function(l,i){l.classList.toggle('flip',i<cur)});
  count.textContent=(cur+1)+' / '+N;
  prev.disabled=cur===0; next.disabled=cur===N-1;
  if(cur>0)hint.style.visibility='hidden';
}
function go(d){var n=cur+d;if(n<0||n>N-1)return;cur=n;render()}

env.addEventListener('click',function(){
  if(opened)return;opened=true;env.classList.add('open');
  document.getElementById('tap').classList.add('hide');
  setTimeout(function(){stage.classList.add('gone');view.classList.add('show')},2200);
});
prev.addEventListener('click',function(){go(-1)});
next.addEventListener('click',function(){go(1)});
book.addEventListener('click',function(e){
  if(swiped)return;
  var r=book.getBoundingClientRect();
  go(e.clientX-r.left>r.width/2?1:-1);
});
book.addEventListener('touchstart',function(e){sx=e.touches[0].clientX},{passive:true});
book.addEventListener('touchend',function(e){
  var dx=e.changedTouches[0].clientX-sx;
  if(Math.abs(dx)>40){go(dx<0?1:-1);swiped=true;setTimeout(function(){swiped=false},400)}
},{passive:true});
document.addEventListener('keydown',function(e){
  if(e.key==='ArrowRight')go(1);
  if(e.key==='ArrowLeft')go(-1);
});
render();
</script>
</body></html>
