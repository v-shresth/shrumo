<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta property="og:title" content="Shruti weds Mohit – Wedding Invitation">
<meta property="og:description" content="Monday, 30 November 2026 · Royal Residency, Aligarh. Tap to open your invitation.">
<meta property="og:image" content="https://YOUR-USERNAME.github.io/REPO-NAME/images/cover.jpg">
<meta property="og:type" content="website">
<title>Shruti weds Mohit – Wedding Invitation</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;1,500&display=swap" rel="stylesheet">
<style>
:root{--wine:#f8f2e4;--wine2:#e8dcc0;--gold:#b8924a;--ivory:#3b2a20;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:inherit;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{background:radial-gradient(ellipse at 50% 30%,var(--wine) 0%,var(--wine2) 75%);color:var(--ivory);font-family:"Cormorant Garamond",Georgia,serif;overflow:hidden}
#stage{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;transition:opacity .8s}
#stage.gone{opacity:0;pointer-events:none}
.names{font-size:clamp(26px,8vw,40px);font-style:italic;margin:0 0 6px;color:#7d5f26}
.sub{margin:0 0 34px;letter-spacing:.08em;font-size:17px;opacity:.85}
.env{position:relative;width:min(86vw,420px);aspect-ratio:4/3;cursor:pointer;perspective:1000px;border:0;background:none;padding:0}
.back{position:absolute;inset:0;background:#e0cfa6;border-radius:6px;box-shadow:0 24px 50px rgba(90,60,20,.3)}
.card{position:absolute;left:5%;right:5%;top:6%;bottom:6%;background:#fff;border-radius:4px;transition:transform 1s .6s cubic-bezier(.3,.7,.2,1);z-index:2}
.card img{width:100%;height:100%;object-fit:cover;display:block;border-radius:4px}
.front{position:absolute;inset:0;z-index:3;background:linear-gradient(160deg,#f5ecd6,#e8d9b6);clip-path:polygon(0 0,50% 52%,100% 0,100% 100%,0 100%);border-radius:6px}
.flap{position:absolute;left:0;right:0;top:0;height:56%;z-index:4;background:linear-gradient(#f7efdb,#e6d6af);clip-path:polygon(0 0,100% 0,50% 100%);transform-origin:top;transition:transform .8s,z-index 0s .4s;border-radius:6px 6px 0 0}
.seal{position:absolute;left:50%;top:44%;width:17%;aspect-ratio:1;transform:translate(-50%,-50%);z-index:5;border-radius:50%;background:radial-gradient(circle at 35% 30%,#e6c987,var(--gold) 60%,#8f7236);display:grid;place-items:center;color:#3b2a20;font-style:italic;font-weight:500;font-size:clamp(13px,4.2vw,20px);box-shadow:0 3px 8px rgba(0,0,0,.4);transition:opacity .3s}
.tap{margin-top:34px;font-size:18px;letter-spacing:.12em;animation:p 2s infinite}
@keyframes p{50%{opacity:.35}}
.open .flap{transform:rotateX(180deg);z-index:1}
.open .seal{opacity:0}
.open .card{transform:translateY(-62%) scale(1.05)}
.open+.tap{visibility:hidden}
#view{position:fixed;inset:0;display:flex;flex-direction:column;opacity:0;pointer-events:none;transition:opacity .9s;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
#view.show{opacity:1;pointer-events:auto}
.head{text-align:center;padding:16px 12px 4px;font-style:italic;color:#7d5f26;font-size:24px}
.track{flex:1;display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.track::-webkit-scrollbar{display:none}
.pg{flex:0 0 100%;scroll-snap-align:center;display:flex;align-items:center;justify-content:center;padding:10px}
.pg img{max-width:100%;max-height:100%;object-fit:contain;border-radius:10px;box-shadow:0 14px 32px rgba(90,60,20,.28);background:#fff}
.foot{display:flex;flex-direction:column;align-items:center;gap:10px;padding:8px 0 16px}
.dots{display:flex;gap:9px}
.dots i{width:8px;height:8px;border-radius:50%;background:var(--ivory);opacity:.3;transition:.3s}
.dots i.on{opacity:1;background:var(--gold);transform:scale(1.3)}
.hint{font-size:15px;opacity:.7;margin:0}
.map{color:#fffaf0;background:#9a7632;text-decoration:none;padding:9px 20px;border-radius:30px;font-size:18px;font-weight:500}
@media (prefers-reduced-motion:reduce){*{transition-duration:.01s!important;animation:none!important}}
</style></head>
<body>
<div id="stage">
  <p class="names">Shruti &amp; Mohit</p>
  <p class="sub">You’re invited</p>
  <button class="env" id="env" aria-label="Open the invitation">
    <div class="back"></div>
    <div class="card"><img src="images/cover.jpg" alt=""></div>
    <div class="front"></div>
    <div class="flap"></div>
    <div class="seal">S&amp;M</div>
  </button>
  <div class="tap" id="tap">Tap to open</div>
</div>

<div id="view">
  <div class="head">Shruti weds Mohit</div>
  <div class="track" id="track">
    <div class="pg"><img src="images/cover.jpg" alt="Save the date: Monday, 30 November 2026"></div>
    <div class="pg"><img src="images/invitation.jpg" alt="Wedding ceremony invitation"></div>
    <div class="pg"><img src="images/schedule.jpg" alt="Golden Moments: event schedule"></div>
    <div class="pg"><img src="images/compliments.jpg" alt="With best compliments from"></div>
  </div>
  <div class="foot">
    <div class="dots" id="dots"><i class="on"></i><i></i><i></i><i></i></div>
    <p class="hint" id="hint">Swipe to turn the page</p>
    <a class="map" href="https://www.google.com/maps/search/?api=1&query=Royal+Residency+GT+Road+Aligarh" target="_blank" rel="noopener">Venue on map</a>
  </div>
</div>

<script>
(function(){var t=document.getElementById('track');t.appendChild(t.children[1]);})();var env=document.getElementById('env'),stage=document.getElementById('stage'),view=document.getElementById('view'),
track=document.getElementById('track'),dots=document.querySelectorAll('#dots i'),done=false;
env.addEventListener('click',function(){
  if(done)return;done=true;env.classList.add('open');
  setTimeout(function(){stage.classList.add('gone');view.classList.add('show')},2200);
});
track.addEventListener('scroll',function(){
  var i=Math.round(track.scrollLeft/track.clientWidth);
  for(var k=0;k<dots.length;k++)dots[k].classList.toggle('on',k===i);
  if(i>0)document.getElementById('hint').style.visibility='hidden';
});
</script>
</body></html>
